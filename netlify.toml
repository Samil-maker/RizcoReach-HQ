# Client payment links (/pay/<token>) all load the one payment page (src/pages/pay.astro).
[[redirects]]
  from = "/pay/*"
  to = "/pay.html"
  status = 200
  force = true

# Payment pages and the private invoices page stay out of search engines.
[[headers]]
  for = "/pay*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-cache"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/invoices*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-cache"
    Referrer-Policy = "no-referrer"

# Private phone page for the Lead Hunter extension's outreach queue.
[[headers]]
  for = "/outreach*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-cache"
    Referrer-Policy = "no-referrer"

# Private Lead Desk page and its assets (/desk, /desk-assets/*).
[[headers]]
  for = "/desk*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-cache"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
