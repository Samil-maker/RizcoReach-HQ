<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#050505" />
    <link rel="icon" type="image/png" href="/favicon-48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Invoices</title>
    <!-- Private page for creating client payment links. Page logic: /pay-assets/invoices.js; API: /api/pay (netlify/functions/pay.mts). -->
    <link rel="stylesheet" href="/desk-assets/desk.css?v=1" />
    <link rel="stylesheet" href="/pay-assets/invoices.css?v=1" />
  </head>
  <body>
    <div data-app hidden>
      <header class="head">
        <div class="shell">
          <div class="bar">
            <div class="title">
              <h1>Invoices</h1>
              <div class="status"><span data-status>Loading…</span></div>
            </div>
            <button type="button" class="icon-btn" data-act="refresh" aria-label="Refresh">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8" /><path d="M21 3v5h-5" /></svg>
            </button>
          </div>
        </div>
      </header>
      <main class="shell main">
        <p class="banner" data-banner hidden></p>

        <form class="card" data-form="create">
          <h2>New payment link</h2>
          <label class="field"><span>Client</span><input name="client" required maxlength="120" placeholder="Art Services LLC" autocomplete="off" /></label>
          <label class="field"><span>What it's for</span><input name="description" maxlength="300" placeholder="Meta ads management, month 1 (upfront)" autocomplete="off" /></label>
          <div class="grid2">
            <label class="field"><span>Amount (AED)</span><input name="amountAed" required inputmode="decimal" placeholder="425" autocomplete="off" /></label>
            <label class="field"><span>Invoice number <small>(optional)</small></span><input name="number" maxlength="40" placeholder="Automatic" autocomplete="off" /></label>
          </div>
          <label class="field"><span>Client WhatsApp <small>(optional, for the Send button)</small></span><input name="clientWa" inputmode="tel" maxlength="30" placeholder="05x xxx xxxx" autocomplete="off" /></label>
          <button class="btn primary big">Create payment link</button>
          <p class="err" data-create-error role="alert"></p>
        </form>

        <h2 class="list-h">All invoices</h2>
        <div class="list" data-list></div>
      </main>
    </div>

    <section class="pair" data-pair hidden>
      <form data-form="pair">
        <h1>Invoices</h1>
        <p>Enter your key to open this page. It is your <b>LEAD_DESK_KEY</b> from Netlify (or <b>INVOICE_ADMIN_KEY</b> if you set a separate one).</p>
        <input type="text" name="username" value="Invoices" autocomplete="username" hidden />
        <label class="field"><span>Key</span><input type="password" name="key" autocomplete="current-password" required /></label>
        <button class="btn primary">Open</button>
        <p class="err" data-pair-error role="alert"></p>
      </form>
    </section>

    <div class="toast" data-toast role="status" aria-live="polite" hidden></div>
    <noscript><p class="note">This page needs JavaScript.</p></noscript>
    <script src="/pay-assets/invoices.js?v=1"></script>
  </body>
</html>
