<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#050505" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Outreach" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/favicon-48.png" />
    <title>Outreach queue</title>
    <!-- Private phone companion for the Lead Hunter Chrome extension (lead-hunter/). Data comes from /api/lead-queue. -->
    <style>
      :root {
        color-scheme: dark;
        --bg: #050505;
        --panel: #101010;
        --panel-2: #181818;
        --line: rgb(255 255 255 / 0.09);
        --line-2: rgb(255 255 255 / 0.18);
        --fg: #f4f4f1;
        --fg-2: #b8b8b3;
        --fg-3: #8d8d88;
        --hot: #ff8a5b;
        --warm: #f5c451;
        --cold: #7b8794;
        --wa: #25d366;
        --bad: #ff6b6b;
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.45 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      body { padding: 0 0 calc(env(safe-area-inset-bottom) + 24px); min-height: 100vh; }
      [hidden] { display: none !important; }
      button, a.btn { font: inherit; color: inherit; }
      header { position: sticky; top: 0; z-index: 5; background: rgb(5 5 5 / 0.94); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); padding: calc(env(safe-area-inset-top) + 14px) 16px 0; }
      .top { display: flex; align-items: center; gap: 12px; }
      h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
      .sub { color: var(--fg-3); font-size: 13px; }
      .icon-btn { margin-left: auto; width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--panel-2); display: grid; place-items: center; cursor: pointer; }
      .icon-btn svg { width: 20px; height: 20px; }
      .icon-btn.spin svg { animation: spin 0.8s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .tabs { display: flex; gap: 4px; margin-top: 12px; }
      .tabs button { flex: 1; min-height: 44px; border: 0; background: none; border-bottom: 2px solid transparent; color: var(--fg-3); font-weight: 600; cursor: pointer; }
      .tabs button[aria-selected='true'] { color: var(--fg); border-bottom-color: var(--fg); }
      main { padding: 12px 16px; display: grid; gap: 12px; max-width: 640px; margin: 0 auto; }
      /* One column that can shrink below its content, so long names and bubbles end in … instead of pushing the page sideways. */
      main, .card, .bubbles { grid-template-columns: minmax(0, 1fr); }
      .card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: grid; gap: 10px; }
      .card.done { opacity: 0.6; }
      .row { display: flex; align-items: center; gap: 10px; }
      .name { font-weight: 650; font-size: 17px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .heat { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 99px; font-variant-numeric: tabular-nums; }
      .heat.hot { color: var(--hot); background: rgb(255 138 91 / 0.14); }
      .heat.warm { color: var(--warm); background: rgb(245 196 81 / 0.12); }
      .heat.cold { color: var(--cold); background: rgb(123 135 148 / 0.14); }
      .meta { color: var(--fg-3); font-size: 13.5px; display: flex; gap: 6px; flex-wrap: wrap; }
      .issue { color: var(--fg-2); font-size: 14px; }
      .msg { background: var(--panel-2); border-radius: 12px; padding: 10px 12px; }
      .msg > div { color: var(--fg-2); font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
      .msg.open > div { display: block; }
      .more { background: none; border: 0; color: var(--fg-3); font-size: 13px; padding: 0; justify-self: start; cursor: pointer; min-height: 32px; }
      .btn { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; border-radius: 14px; border: 1px solid var(--line-2); background: var(--panel-2); font-weight: 650; text-decoration: none; cursor: pointer; font-size: 15px; }
      .btn.wa { background: var(--wa); color: #052e16; border-color: var(--wa); font-size: 16.5px; min-height: 54px; }
      .btn.wa svg { width: 22px; height: 22px; flex: none; }
      .btn.ghost { background: transparent; }
      .btn.danger { color: var(--bad); }
      .actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .bubbles { display: grid; gap: 8px; }
      .bubbles .btn.wa { justify-content: flex-start; padding: 0 16px; text-align: left; }
      .bubbles .btn.wa span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .bubbles .btn.wa.ticked { background: var(--panel-2); color: var(--wa); border-color: rgb(37 211 102 / 0.4); }
      .bubbles .tick { width: 22px; text-align: center; font-weight: 800; flex: none; }
      .state { color: var(--fg-3); font-size: 13px; }
      .empty, .pair { text-align: center; color: var(--fg-2); padding: 48px 12px; display: grid; gap: 14px; justify-items: center; }
      .pair h2, .empty h2 { margin: 0; color: var(--fg); font-size: 20px; }
      .pair ol { text-align: left; margin: 0; padding-left: 20px; display: grid; gap: 8px; max-width: 420px; }
      .note { color: var(--fg-3); font-size: 13px; text-align: center; padding: 8px 16px; }
      .err { color: var(--bad); }
      .toast { position: fixed; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom) + 16px); z-index: 10; background: var(--fg); color: #0b0b0b; border-radius: 14px; padding: 14px 16px; font-weight: 600; display: flex; align-items: center; gap: 12px; box-shadow: 0 10px 30px rgb(0 0 0 / 0.5); max-width: 560px; margin: 0 auto; }
      .toast button { margin-left: auto; background: none; border: 0; font-weight: 700; text-decoration: underline; min-height: 32px; cursor: pointer; color: #0b0b0b; }
      @media (prefers-reduced-motion: reduce) { .icon-btn.spin svg { animation: none; } }
    </style>
  </head>
  <body>
    <header>
      <div class="top">
        <div>
          <h1>Outreach queue</h1>
          <div class="sub" data-sub>Loading…</div>
        </div>
        <button class="icon-btn" data-refresh aria-label="Refresh">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
        </button>
      </div>
      <nav class="tabs" role="tablist" data-tabs>
        <button role="tab" data-tab="queued" aria-selected="true">To send</button>
        <button role="tab" data-tab="sent" aria-selected="false">Sent</button>
        <button role="tab" data-tab="removed" aria-selected="false">Removed</button>
      </nav>
    </header>

    <main data-list></main>

    <section class="pair" data-pair hidden>
      <h2>Pair this phone</h2>
      <ol>
        <li>On your computer, open Lead Hunter → <b>Settings</b> → <b>Phone queue</b>.</li>
        <li>Point this phone's camera at the pairing QR code and open the link.</li>
        <li>Leads you send to your phone will show up here.</li>
      </ol>
    </section>

    <p class="note" data-note></p>
    <div class="toast" data-toast role="status" aria-live="polite" hidden></div>

    <script>
      (() => {
        const KEY = 'lh-queue-pair';
        const CACHE = 'lh-queue-cache';
        const PENDING = 'lh-queue-pending';
        const HIDDEN = 'lh-queue-hidden';
        const TICKS = 'lh-queue-ticks'; // { [id]: { rev, done: [bubble indexes] } }: which bubbles were opened
        const $ = (s) => document.querySelector(s);
        const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
        const ls = {
          get(k, d) {
            try {
              const v = localStorage.getItem(k);
              return v == null ? d : JSON.parse(v);
            } catch {
              return d;
            }
          },
          set(k, v) {
            try {
              localStorage.setItem(k, JSON.stringify(v));
            } catch {}
          },
          del(k) {
            try {
              localStorage.removeItem(k);
            } catch {}
          },
        };
        const WA_ICON = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.4.1-.2 0-.3 0-.5l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.4.8 3.2.6.5-.1 1.5-.6 1.8-1.2.2-.6.2-1.1.1-1.2l-.5-.3Z"/></svg>';

        // The pairing link carries the key in the #fragment (never sent to the server).
        // It stays in the address bar so "Add to Home Screen" keeps it on iPhone too.
        const hash = new URLSearchParams(location.hash.slice(1));
        const stored = ls.get(KEY, null);
        if (hash.get('k') && (!stored || Number(hash.get('t') || 0) >= (stored.t || 0))) ls.set(KEY, { k: hash.get('k'), t: Number(hash.get('t') || 0) });
        const key = (ls.get(KEY, null) || {}).k || '';
        const standalone = navigator.standalone || matchMedia('(display-mode: standalone)').matches;

        let items = ls.get(CACHE, []);
        let tab = 'queued';
        let open = new Set();

        const fmtPhone = (wa) => {
          const m = String(wa).match(/^971(5\d|[234679])(\d{3})(\d{4})$/);
          return m ? `+971 ${m[1]} ${m[2]} ${m[3]}` : `+${wa}`;
        };
        const ago = (t) => {
          const s = Math.max(0, (Date.now() - t) / 1000);
          return s < 90 ? 'just now' : s < 5400 ? `${Math.round(s / 60)} min ago` : s < 129600 ? `${Math.round(s / 3600)} h ago` : `${Math.round(s / 86400)} days ago`;
        };
        const waText = (wa, text) => {
          const m = String(text || '');
          try {
            return m ? `https://wa.me/${wa}?text=${encodeURIComponent(m.toWellFormed ? m.toWellFormed() : m)}` : `https://wa.me/${wa}`;
          } catch {
            return `https://wa.me/${wa}`;
          }
        };
        const waLink = (it) => waText(it.wa, it.message);

        // Items with 2+ bubbles get one button per bubble. Each only prefills WhatsApp: you press Send there.
        const partsOf = (it) => (Array.isArray(it.parts) && it.parts.length > 1 ? it.parts : null);
        // Bubble 1 and one-line bubbles show their text ("Hello Glossy PPF", "Let me know"), cut short by the CSS; longer ones read "Message".
        const partLabel = (t, k) => {
          const one = String(t).trim();
          return k === 0 || !one.includes('\n') ? one.split('\n')[0] : 'Message';
        };
        const ticksOf = (it) => {
          const t = ls.get(TICKS, {})[it.id];
          return t && t.rev === it.addedAt ? t.done : [];
        };
        function tick(it, k) {
          const all = ls.get(TICKS, {});
          const done = new Set(ticksOf(it));
          done.add(k);
          all[it.id] = { rev: it.addedAt, done: [...done] };
          ls.set(TICKS, all);
        }
        const bubbleButtons = (i) =>
          `<div class="bubbles">${partsOf(i)
            .map((p, k) => {
              const done = ticksOf(i).includes(k);
              return `<a class="btn wa ${done ? 'ticked' : ''}" href="${esc(waText(i.wa, p))}" target="_blank" rel="noopener noreferrer" data-act="part" data-k="${k}">${done ? '<span class="tick" aria-label="Opened">✓</span>' : WA_ICON}<span>${k + 1} · ${esc(partLabel(p, k))}</span></a>`;
            })
            .join('')}</div>`;

        async function api(method, body) {
          const res = await fetch('/api/lead-queue', {
            method,
            cache: 'no-store',
            headers: { authorization: `Bearer ${key}`, ...(body ? { 'content-type': 'application/json' } : {}) },
            body: body ? JSON.stringify(body) : undefined,
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw Object.assign(new Error(data.error || `HTTP ${res.status}`), { status: res.status, code: data.error });
          return data;
        }

        function note(text, isErr) {
          const el = $('[data-note]');
          el.textContent = text || '';
          el.classList.toggle('err', !!isErr);
        }

        let toastTimer = 0;
        function toast(text, undo) {
          const t = $('[data-toast]');
          t.innerHTML = `<span>${esc(text)}</span>${undo ? '<button type="button">Undo</button>' : ''}`;
          t.hidden = false;
          if (undo)
            t.querySelector('button').onclick = () => {
              t.hidden = true;
              undo();
            };
          clearTimeout(toastTimer);
          toastTimer = setTimeout(() => (t.hidden = true), undo ? 6000 : 2500);
        }

        function render() {
          const hidden = ls.get(HIDDEN, {});
          const shown = (i) => i.status === 'queued' || hidden[i.id] !== i.statusAt;
          const counts = { queued: 0, sent: 0, removed: 0 };
          items.filter(shown).forEach((i) => counts[i.status]++);
          $('[data-sub]').textContent = key ? `${counts.queued} to send · ${counts.sent} sent` : 'Not paired';
          document.querySelectorAll('[data-tab]').forEach((b) => {
            b.setAttribute('aria-selected', String(b.dataset.tab === tab));
            b.textContent = { queued: 'To send', sent: 'Sent', removed: 'Removed' }[b.dataset.tab] + (counts[b.dataset.tab] ? ` (${counts[b.dataset.tab]})` : '');
          });
          const list = items
            .filter((i) => i.status === tab && shown(i))
            .sort((a, b) => (tab === 'queued' ? b.priority - a.priority || a.addedAt - b.addedAt : b.statusAt - a.statusAt));
          const el = $('[data-list]');
          if (!list.length) {
            el.innerHTML =
              tab === 'queued'
                ? `<div class="empty"><h2>Nothing to send</h2><p>Select leads in Lead Hunter on your computer and press <b>Send to phone</b>. They will appear here.</p></div>`
                : `<div class="empty"><p>Nothing here yet.</p></div>`;
          } else {
            el.innerHTML =
              list
                .map(
                  (i) => `<article class="card ${i.status !== 'queued' ? 'done' : ''}" data-id="${esc(i.id)}">
                <div class="row"><span class="name">${esc(i.name)}</span><span class="heat ${esc(i.heat)}">${esc(i.priority)}</span></div>
                <div class="meta"><span>${esc(fmtPhone(i.wa))}</span>${i.domain ? `<span>· ${esc(i.domain)}</span>` : ''}</div>
                ${i.issue ? `<div class="issue">${esc(i.issue)}</div>` : ''}
                <div class="msg ${open.has(i.id) ? 'open' : ''}"><div>${esc(i.message)}</div></div>
                <button class="more" data-act="more">${open.has(i.id) ? 'Show less' : 'Show full message'}</button>
                ${
                  i.status === 'queued'
                    ? `${partsOf(i) ? bubbleButtons(i) : `<a class="btn wa" href="${esc(waLink(i))}" target="_blank" rel="noopener noreferrer" data-act="wa">${WA_ICON} Open WhatsApp</a>`}
                <div class="actions">
                  <button class="btn ghost" data-act="copy">Copy</button>
                  <a class="btn ghost" href="tel:+${esc(i.wa)}">Call</a>
                  <button class="btn ghost danger" data-act="remove">Remove</button>
                </div>`
                    : `<div class="row"><span class="state">${i.status === 'sent' ? 'Sent' : 'Removed'} ${esc(ago(i.statusAt))}</span>
                  <a class="btn ghost" style="margin-left:auto;padding:0 14px" href="${esc(partsOf(i) ? waText(i.wa) : waLink(i))}" target="_blank" rel="noopener noreferrer">Open chat</a>
                  <button class="btn ghost" style="padding:0 14px" data-act="requeue">Move back</button></div>`
                }
              </article>`,
                )
                .join('') +
              (tab !== 'queued' ? `<button class="btn ghost" data-act="clear">Clear this list</button>` : '');
          }
          $('[data-pair]').hidden = !!key;
          el.hidden = !key;
        }

        // Taps are applied locally at once and synced in the background (works with a flaky connection).
        let mutations = 0;
        function setStatus(item, status) {
          mutations++;
          const rev = item.addedAt;
          item.status = status;
          item.statusAt = Date.now();
          ls.set(CACHE, items);
          const pending = ls.get(PENDING, []).filter((p) => p.id !== item.id);
          pending.push({ id: item.id, status, rev });
          ls.set(PENDING, pending);
          render();
          flush();
        }

        let flushing = false;
        let flushErr = null;
        async function flush() {
          const pending = ls.get(PENDING, []);
          if (!pending.length || flushing || !key) return;
          flushing = true;
          flushErr = null;
          try {
            const q = await api('POST', { updates: pending });
            // Keep only taps made while this request was in flight.
            const sent = (p) => pending.some((x) => x.id === p.id && x.status === p.status && x.rev === p.rev);
            const left = ls.get(PENDING, []).filter((p) => !sent(p));
            ls.set(PENDING, left);
            if (!left.length) apply(q);
            note('');
          } catch (e) {
            flushErr = e;
            if (!e.status) note('Offline. Your taps will sync when you are back online.', true);
          } finally {
            flushing = false;
          }
        }

        function apply(q) {
          items = Array.isArray(q.items) ? q.items : [];
          ls.set(CACHE, items);
          // Forget bubble ticks for items that are gone.
          const ticks = ls.get(TICKS, {});
          for (const id of Object.keys(ticks)) if (!items.some((i) => i.id === id)) delete ticks[id];
          ls.set(TICKS, ticks);
          render();
        }

        async function load() {
          if (!key) return render();
          const btn = $('[data-refresh]');
          btn.classList.add('spin');
          try {
            await flush();
            if (flushErr && flushErr.status) throw flushErr;
            const seq = mutations;
            const q = await api('GET');
            if (seq === mutations && !ls.get(PENDING, []).length) apply(q);
            note('');
          } catch (e) {
            if (e.status === 401)
              note(
                standalone
                  ? 'This app is using an old pairing key. Delete this icon from your home screen, scan the new pairing QR in Lead Hunter, and add it again.'
                  : 'This phone is no longer paired (the key changed). Scan the pairing QR in Lead Hunter again.',
                true,
              );
            else if (e.status === 503) note('The phone queue is not switched on yet: add LEAD_QUEUE_KEY in Netlify, then redeploy.', true);
            else note('Could not reach the server. Showing the last saved list.', true);
          } finally {
            btn.classList.remove('spin');
          }
        }

        document.addEventListener('click', async (e) => {
          const t = e.target.closest('[data-act], [data-tab], [data-refresh]');
          if (!t) return;
          if (t.dataset.refresh !== undefined) return load();
          if (t.dataset.tab) {
            tab = t.dataset.tab;
            window.scrollTo(0, 0);
            return render();
          }
          const act = t.dataset.act;
          if (act === 'clear') {
            const hidden = ls.get(HIDDEN, {});
            items.filter((i) => i.status === tab).forEach((i) => (hidden[i.id] = i.statusAt));
            ls.set(HIDDEN, hidden);
            return render();
          }
          const card = t.closest('[data-id]');
          const item = card && items.find((i) => i.id === card.dataset.id);
          if (!item) return;
          if (act === 'more') {
            open.has(item.id) ? open.delete(item.id) : open.add(item.id);
            return render();
          }
          if (act === 'wa') {
            // Let the link open WhatsApp, then file the lead under "Sent".
            setTimeout(() => {
              setStatus(item, 'sent');
              toast(`${item.name} marked as sent`, () => setStatus(item, 'queued'));
            }, 400);
            return;
          }
          if (act === 'part') {
            // Let the link open WhatsApp with this bubble, then tick it. The last bubble files the lead under "Sent".
            const k = Number(t.dataset.k);
            const last = k === (partsOf(item) || []).length - 1;
            setTimeout(() => {
              tick(item, k);
              if (!last || item.status !== 'queued') return render();
              setStatus(item, 'sent');
              toast(`${item.name} marked as sent`, () => setStatus(item, 'queued'));
            }, 400);
            return;
          }
          if (act === 'copy') {
            try {
              await navigator.clipboard.writeText(item.message);
              toast('Message copied');
            } catch {
              toast('Could not copy on this phone');
            }
            return;
          }
          if (act === 'remove') {
            setStatus(item, 'removed');
            return toast(`${item.name} removed`, () => setStatus(item, 'queued'));
          }
          if (act === 'requeue') return setStatus(item, 'queued');
        });

        document.addEventListener('visibilitychange', () => document.visibilityState === 'visible' && load());
        addEventListener('online', flush);
        render();
        load();
        setInterval(() => document.visibilityState === 'visible' && load(), 60000);
      })();
    </script>
  </body>
</html>
