<form class="form" name="elheen-founders" method="POST" data-netlify="true" netlify-honeypot="company_site" action="thanks.html">
  <input type="hidden" name="form-name" value="elheen-founders">
  <p class="hp"><label>Leave this empty <input name="company_site" tabindex="-1" autocomplete="off"></label></p>
  <h3>Claim a founding place</h3>
  <p>Tell us about your business. We reply on WhatsApp within one working day.</p>
  <div class="places"><i aria-hidden="true"></i>10 founding places, each set up by hand</div>
  <label>Business name<input name="business" required autocomplete="organization"></label>
  <label>Your WhatsApp number<input name="whatsapp" type="tel" inputmode="tel" required autocomplete="tel" placeholder="+971 5X XXX XXXX"></label>
  <label>Type of business
    <select name="type" required>
      <option value="">Choose one</option>
      <option>Salon or barber</option>
      <option>Spa or wellness</option>
      <option>Beauty or aesthetic clinic</option>
      <option>Fitness or studio</option>
      <option>Home improvement</option>
      <option>Interior design</option>
      <option>Something else</option>
    </select>
  </label>
  <button class="btn btn-primary" type="submit">Request my place
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
  </button>
  <small>Nothing to pay upfront. No card needed.</small>
</form>
