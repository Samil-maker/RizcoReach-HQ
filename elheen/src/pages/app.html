<!--{"title":"Elheen","description":"Your enquiries, bookings and calendar.","nav":"","noindex":true,"bare":true,"scripts":["owner.js"]}-->
<div class="shell wide">
  <div class="topbar"><img src="assets/logo.svg" alt="elheen"><button class="btn btn-ghost btn-sm" id="signOut" hidden>Sign out</button></div>

  <!-- sign in / create -->
  <section id="authView" hidden style="max-width:460px;margin:24px auto 0">
    <form class="panel" id="loginForm">
      <h1 style="font-size:1.8rem;margin-bottom:6px">Sign in</h1>
      <p class="hint" style="margin-bottom:16px">See your enquiries and your calendar.</p>
      <label>Business name<input id="loginSlug" autocomplete="organization" required></label>
      <label class="field">Password<input id="loginPass" type="password" autocomplete="current-password" required></label>
      <p class="error" id="loginError" role="alert" hidden></p>
      <button class="btn btn-primary wide-btn" type="submit">Sign in</button>
      <p class="auth-switch">New here? <button type="button" data-show="signup">Set up a business</button></p>
    </form>
    <form class="panel" id="signupForm" hidden>
      <h1 style="font-size:1.8rem;margin-bottom:6px">Set up your business</h1>
      <p class="hint" style="margin-bottom:16px">It takes about a minute.</p>
      <label>Invite code<input id="suInvite" required></label>
      <label class="field">Business name<input id="suName" autocomplete="organization" required></label>
      <label class="field">Type of business
        <select id="suKind">
          <option value="interior">Interior design</option><option value="home">Home improvement</option>
          <option value="cleaning">Cleaning</option><option value="salon">Salon or barber</option>
          <option value="clinic">Clinic</option><option value="fitness">Fitness or studio</option>
          <option value="automotive">Car care</option><option value="other">Something else</option>
        </select>
      </label>
      <label class="field">Area <span class="hint">(optional)</span><input id="suArea" placeholder="Jumeirah, Dubai"></label>
      <label class="field">Password <span class="hint">(8 characters or more)</span><input id="suPass" type="password" autocomplete="new-password" minlength="8" required></label>
      <p class="error" id="signupError" role="alert" hidden></p>
      <button class="btn btn-primary wide-btn" type="submit">Create my page</button>
      <p class="auth-switch">Already set up? <button type="button" data-show="login">Sign in</button></p>
    </form>
  </section>

  <!-- the app -->
  <section id="appView" hidden>
    <div id="inboxTab">
      <div class="chips" id="filters" role="group" aria-label="Filter enquiries"></div>
      <div id="leadList"></div>
    </div>

    <div id="detailTab" hidden>
      <button class="back" id="backBtn" type="button">← All enquiries</button>
      <div class="panel detail" id="detail"></div>
    </div>

    <div id="calendarTab" hidden><div id="agenda"></div></div>

    <div id="settingsTab" hidden>
      <div class="panel">
        <h2 style="font-size:1.4rem">Your enquiry link</h2>
        <p class="hint" style="margin-top:6px">Put this in your Instagram bio, your ads and your Google profile.</p>
        <div class="link-box"><input id="shareLink" readonly><button class="btn btn-primary btn-sm" id="copyLink" type="button">Copy</button></div>
        <p class="hint" id="copyStatus" role="status"></p>
      </div>
      <form class="panel" id="settingsForm">
        <h2 style="font-size:1.4rem;margin-bottom:14px">Services</h2>
        <div class="svc-row hint" aria-hidden="true"><span>Name</span><span>Minutes</span><span>AED</span><span></span></div>
        <div id="svcList"></div>
        <button class="btn btn-ghost btn-sm" type="button" id="addSvc">Add a service</button>
        <h2 style="font-size:1.4rem;margin:26px 0 8px">What clients are asked</h2>
        <label class="check"><input type="checkbox" id="askPhotos">Ask for photos of the space</label>
        <label class="check"><input type="checkbox" id="askAddress">Ask for an address and location</label>
        <h2 style="font-size:1.4rem;margin:26px 0 8px">Opening hours</h2>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
          <label>Open from<select id="openHour"></select></label>
          <label>Close at<select id="closeHour"></select></label>
        </div>
        <p class="error" id="settingsError" role="alert" hidden></p>
        <button class="btn btn-primary wide-btn" type="submit" id="saveSettings">Save changes</button>
        <p class="hint" id="saveStatus" role="status" style="text-align:center;margin-top:10px"></p>
      </form>
    </div>

    <nav class="tabs" role="tablist" aria-label="Sections">
      <button role="tab" aria-selected="true" data-tab="inbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 13l2-8h12l2 8M4 13v6h16v-6M4 13h5l1 2h4l1-2h5"/></svg>Enquiries</button>
      <button role="tab" aria-selected="false" data-tab="calendar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Calendar</button>
      <button role="tab" aria-selected="false" data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>Set-up</button>
    </nav>
  </section>
</div>
