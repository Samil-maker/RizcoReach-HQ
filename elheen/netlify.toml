# Elheen is a separate site from rizcoreach.ae.
# In Netlify: add a new site from this repository and set Base directory to "elheen".
[build]
  command = "node build.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Each business's enquiry page: elheen.com/b/their-name
[[redirects]]
  from = "/b/*"
  to = "/b.html"
  status = 200

[[redirects]]
  from = "/app"
  to = "/app.html"
  status = 200
