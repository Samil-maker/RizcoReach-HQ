:root {
  /* Palette taken from Bella's own projects: lime plaster, travertine, walnut, oxblood velvet */
  --plaster: #E6DED4;
  --plaster-2: #DAD0C4;
  --plaster-3: #CDBFAF;
  --paper: #EFE9E1;
  --stone: #B9A690;
  --line: #7E6A5A;
  --ink: #2A201B;
  --ink-2: #5A4B42;
  --walnut: #3A2A22;
  --walnut-2: #4A372D;
  --oxblood: #74332C;
  --oxblood-2: #5C2722;
  --on-dark: #EFE7DD;
  --on-dark-2: #C4B6A8;
  --rule: rgba(42, 32, 27, .16);
  --rule-strong: rgba(42, 32, 27, .38);

  --font-display: "Marcellus", "Iowan Old Style", "Times New Roman", serif;
  --font-body: "Hanken Grotesk", -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;

  --gutter: clamp(20px, 5vw, 64px);
  --maxw: 1320px;
  --header-h: 72px;

  --ease-out: cubic-bezier(.22, .8, .12, 1);
  --ease-in: cubic-bezier(.55, 0, .8, .2);
  --d-fast: 180ms;

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: calc(var(--header-h) + 16px); }
body {
  margin: 0;
  background: var(--plaster);
  color: var(--ink);
  font: 400 17px/1.6 var(--font-body);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
img, svg { display: block; max-width: 100%; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; font-synthesis: none; margin: 0; text-wrap: balance; }
p { text-wrap: pretty; }
p { margin: 0; }
.statement { text-wrap: balance; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--oxblood); outline-offset: 3px; }
.on-dark :focus-visible { outline-color: var(--on-dark); }
[tabindex="-1"]:focus { outline: none; }

.visually-hidden { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.skip-link { position: fixed; left: 12px; top: -60px; z-index: 100; background: var(--ink); color: var(--plaster); padding: 12px 16px; text-decoration: none; transition: top var(--d-fast); }
.skip-link:focus { top: 12px; }

.wrap { max-width: var(--maxw); margin-inline: auto; padding-inline: max(var(--gutter), env(safe-area-inset-left)); }
.section { padding-block: clamp(80px, 11vw, 160px); }
.on-dark { background: var(--walnut); color: var(--on-dark); }

/* ---------- Type ---------- */
.display { font-size: clamp(44px, 5.7vw, 88px); line-height: 1.02; letter-spacing: -.015em; }
.display-2 { font-size: clamp(44px, 6.2vw, 92px); line-height: 1.04; letter-spacing: -.012em; }
.h2 { font-size: clamp(34px, 4.6vw, 64px); line-height: 1.06; letter-spacing: -.01em; }
.h3 { font-size: clamp(24px, 2.2vw, 30px); line-height: 1.15; }
.lead { font-size: clamp(18px, 1.55vw, 21px); line-height: 1.55; color: var(--ink-2); max-width: 38ch; }
.on-dark .lead, .on-dark .muted { color: var(--on-dark-2); }
.muted { color: var(--ink-2); }
.prose p { max-width: 62ch; }
.prose p + p { margin-top: 1.1em; }
.statement { font-family: var(--font-display); font-size: clamp(28px, 3.2vw, 44px); line-height: 1.22; max-width: 26ch; }

.link { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 5px; text-decoration-color: var(--rule-strong); transition: color var(--d-fast), text-decoration-color var(--d-fast); }
.link:hover { color: var(--oxblood); text-decoration-color: currentColor; }
.on-dark .link { text-decoration-color: rgba(239, 231, 221, .4); }
.on-dark .link:hover { color: #fff; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 50px; padding: 0 24px; border: 0; border-radius: 2px;
  font: 500 16px/1 var(--font-body); letter-spacing: .005em; text-decoration: none; cursor: pointer;
  touch-action: manipulation;
  transition: background-color var(--d-fast), color var(--d-fast), box-shadow var(--d-fast), transform var(--d-fast) var(--ease-out);
}
.btn:active { transform: scale(.98); }
.btn-primary { background: var(--oxblood); color: #F7EFE7; }
.btn-primary:hover { background: var(--oxblood-2); }
.btn-quiet { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1px var(--rule-strong); }
.btn-quiet:hover { background: var(--plaster-2); box-shadow: inset 0 0 0 1px var(--ink); }
.on-dark .btn-quiet { color: var(--on-dark); box-shadow: inset 0 0 0 1px rgba(239, 231, 221, .45); }
.on-dark .btn-quiet:hover { background: var(--walnut-2); box-shadow: inset 0 0 0 1px var(--on-dark); }
.btn-sm { min-height: 44px; padding: 0 18px; font-size: 15px; }
.btn[disabled] { opacity: .5; cursor: progress; }
.actions { display: flex; flex-wrap: wrap; gap: 12px; }

/* ---------- Logo ---------- */
.logo-b {
  display: inline-block; flex: none; aspect-ratio: 199 / 260; background: currentColor;
  -webkit-mask: var(--logo) center / contain no-repeat; mask: var(--logo) center / contain no-repeat;
}

/* ---------- Header ---------- */
.site-header {
  position: sticky; top: 0; z-index: 50;
  background: rgba(230, 222, 212, .9);
  -webkit-backdrop-filter: saturate(1.2) blur(12px); backdrop-filter: saturate(1.2) blur(12px);
  border-bottom: 1px solid transparent;
  transition: border-color var(--d-mid);
  padding-top: env(safe-area-inset-top);
}
.site-header.is-scrolled { border-bottom-color: var(--rule); }
.header-inner { height: var(--header-h); display: flex; align-items: center; justify-content: space-between; gap: 24px; }
.brand { display: inline-flex; align-items: center; gap: 12px; text-decoration: none; color: var(--ink); min-height: 44px; }
.brand .logo-b { height: 38px; }
.brand-name { font-family: var(--font-display); font-size: 21px; letter-spacing: .01em; }
.nav { display: none; align-items: center; gap: 34px; }
.nav a:not(.btn) { text-decoration: none; font-size: 16px; padding-block: 10px; background: linear-gradient(currentColor, currentColor) 0 calc(100% - 4px) / 0 1px no-repeat; transition: background-size var(--d-mid) var(--ease-out), color var(--d-fast); }
.nav a:not(.btn):hover, .nav a:not(.btn)[aria-current="page"] { background-size: 100% 1px; }
.nav a:not(.btn)[aria-current="page"] { color: var(--oxblood); }
.menu-btn { min-height: 44px; min-width: 44px; padding: 0 4px; background: none; border: 0; font-size: 16px; font-weight: 500; cursor: pointer; text-decoration: underline; text-underline-offset: 5px; text-decoration-color: var(--rule-strong); }
@media (min-width: 920px) { .nav { display: flex; } .menu-btn { display: none; } }

/* Mobile menu */
.menu {
  position: fixed; inset: 0; z-index: 45; background: var(--plaster);
  padding: calc(var(--header-h) + env(safe-area-inset-top) + 24px) max(var(--gutter), env(safe-area-inset-left)) calc(32px + env(safe-area-inset-bottom));
  display: flex; flex-direction: column; justify-content: space-between; gap: 40px; overflow-y: auto;
  opacity: 0; transition: opacity 260ms var(--ease-out);
}
.menu.is-open { opacity: 1; }
.menu[hidden] { display: none; }
.menu-links { list-style: none; margin: 0; padding: 0; }
.menu-links a { display: block; padding-block: 10px; font-family: var(--font-display); font-size: clamp(40px, 11vw, 60px); line-height: 1.1; text-decoration: none; }
.menu-links a[aria-current="page"] { color: var(--oxblood); }
.motion .menu-links li { transform: translateY(18px); opacity: 0; transition: transform 520ms var(--ease-out), opacity 520ms var(--ease-out); }
.motion .menu.is-open .menu-links li { transform: none; opacity: 1; }
.motion .menu.is-open .menu-links li:nth-child(2) { transition-delay: 40ms; }
.motion .menu.is-open .menu-links li:nth-child(3) { transition-delay: 80ms; }
.motion .menu.is-open .menu-links li:nth-child(4) { transition-delay: 120ms; }
.motion .menu.is-open .menu-links li:nth-child(5) { transition-delay: 160ms; }
.menu-foot { display: grid; gap: 6px; color: var(--ink-2); }
body.menu-open { overflow: hidden; }
body.menu-open .site-header { background: var(--plaster); }

/* ---------- View transitions between pages ---------- */
#main { min-height: 60vh; }
.motion #main { transition: opacity var(--d-mid) var(--ease-out), transform var(--d-mid) var(--ease-out); }
.motion #main.is-leaving { opacity: 0; transition-duration: 170ms; transition-timing-function: var(--ease-in); }
.motion #main.is-entering { opacity: 0; transform: translateY(14px); transition: none; }

/* ---------- Media (drawings now, photos later) ---------- */
.media { position: relative; overflow: hidden; background: var(--plaster-2); }
.media > svg, .media > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.media .art { position: absolute; inset: 0; }
.media .art > svg, .media .art > img { width: 100%; height: 100%; object-fit: cover; }
.ratio-43 { aspect-ratio: 4 / 3; }
.ratio-34 { aspect-ratio: 3 / 4; }
.ratio-45 { aspect-ratio: 4 / 5; }
.ratio-169 { aspect-ratio: 16 / 9; }
.ratio-32 { aspect-ratio: 3 / 2; }

/* Drawing styles */
.dr * { stroke: var(--line); stroke-width: 1.25; vector-effect: non-scaling-stroke; stroke-linecap: round; stroke-linejoin: round; }
.dr .n { fill: none; }
.dr .w { fill: #DDD3C7; }
.dr .r { fill: #CFC3B4; }
.dr .f { fill: #E8E1D8; }
.dr .l { fill: #F2EDE6; }
.dr .t { fill: #BDAA93; }
.dr .s { fill: #5B4437; }
.dr .a { fill: #7B3F36; }
.dr .c { fill: #D3C8BA; }
.dr .g { fill: none; stroke: #A08D7A; }
.dr .h { fill: none; stroke: #C9BBAB; }

/* Curtain reveal: a plaster panel that draws aside once the image is on screen */
.curtain { display: none; }
.motion .curtain { display: block; position: absolute; inset: 0; z-index: 2; background: var(--plaster-3); transform-origin: 100% 50%; transition: transform 1s var(--ease-out); }
.motion .reveal .art { transform: scale(1.07); transition: transform 1.6s var(--ease-out); }
.motion .reveal.is-in .curtain { transform: scaleX(0); }
.motion .reveal.is-in .art { transform: none; }

/* ---------- Hero ---------- */
.hero { display: grid; gap: clamp(40px, 6vw, 80px); padding-block: clamp(28px, 6vw, 72px) clamp(72px, 9vw, 128px); align-items: end; }
.hero h1 { max-width: 12ch; }
@media (min-width: 900px) { .hero h1 { max-width: none; } }
.hero .lead { margin: clamp(24px, 3vw, 36px) 0 clamp(28px, 3.4vw, 40px); }
.hero-arch { margin: 0; width: min(100%, 470px); justify-self: center; }
.arch-frame { position: relative; aspect-ratio: 3 / 4; overflow: hidden; clip-path: inset(0 round 999px 999px 0 0); background: var(--plaster-2); }
.arch-frame .art { position: absolute; inset: 0; }
.arch-frame svg, .arch-frame img { width: 100%; height: 100%; object-fit: cover; }
.hero-arch figcaption { margin-top: 14px; font-size: 15px; color: var(--ink-2); }
@media (min-width: 900px) {
  .hero { grid-template-columns: minmax(0, 1.3fr) minmax(0, .7fr); }
  .hero-arch { justify-self: end; }
  .arch-frame { aspect-ratio: auto; height: min(74vh, 640px); min-height: 460px; }
}
.line { display: block; overflow: hidden; padding-bottom: .08em; margin-bottom: -.08em; }
.line > span { display: block; }

/* Hero load sequence: the arch's curtain lifts, the lines rise. The one orchestrated moment. */
.motion .hero .line > span { transform: translateY(108%); transition: transform 1s var(--ease-out); }
.motion .hero .line:nth-child(2) > span { transition-delay: 90ms; }
.motion .hero .line:nth-child(3) > span { transition-delay: 180ms; }
.motion .hero .fade { opacity: 0; transform: translateY(10px); transition: opacity .8s var(--ease-out) .5s, transform .8s var(--ease-out) .5s; }
.motion .hero .arch-frame .curtain { transform-origin: 50% 0; transition: transform var(--d-slow) var(--ease-out) .15s; }
.motion .hero .arch-frame .art { transform: scale(1.1); transition: transform 2s var(--ease-out) .15s; }
.motion .hero .hero-arch figcaption { opacity: 0; transition: opacity .8s var(--ease-out) 1s; }
.motion .hero.is-in .line > span, .motion .hero.is-in .fade { transform: none; opacity: 1; }
.motion .hero.is-in .arch-frame .curtain { transform: scaleY(0); }
.motion .hero.is-in .arch-frame .art { transform: none; }
.motion .hero.is-in .hero-arch figcaption { opacity: 1; }

/* ---------- Section heads ---------- */
.sec-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 20px 40px; margin-bottom: clamp(36px, 5vw, 64px); }
.sec-head .h2 { max-width: 16ch; }
.sec-head .lead { margin-top: 18px; }

/* ---------- Sectors list ---------- */
.sectors { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }

  .card a:hover .card-name { color: var(--oxblood); }
}
@media (min-width: 820px) {
  .pgrid { grid-template-columns: repeat(12, minmax(0, 1fr)); }
  .pgrid > .card:nth-child(4n+1) { grid-column: 1 / span 7; }
  .pgrid > .card:nth-child(4n+2) { grid-column: 9 / span 4; margin-top: clamp(80px, 10vw, 160px); }
  .pgrid > .card:nth-child(4n+3) { grid-column: 2 / span 5; }

}
.empty { padding: 48px 0; border-top: 1px solid var(--rule); }

.step-text { color: var(--on-dark-2); max-width: 36ch; }

/* ---------- Project detail ---------- */
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px 20px; margin: clamp(36px, 5vw, 56px) 0 0; padding-top: 28px; border-top: 1px solid var(--rule); }

}
function pendant(x, len, w) {
  return L(x, 0, x, len) + P(`M${x - w / 2} ${len + 34} Q${x - w / 2} ${len} ${x} ${len} Q${x + w / 2} ${len} ${x + w / 2} ${len + 34} Z`, 's') + E(x, len + 40, w * .42, 5, 'l');
}
function palm(x, ground) {
  let o = P(`M${x - 50} ${ground - 120} H${x + 50} L${x + 40} ${ground} H${x - 40} Z`, 't');
  const top = ground - 120;
  [[-170, -260], [-120, -330], [-40, -370], [50, -360], [130, -310], [175, -230], [-70, -200], [90, -190]].forEach(([dx, dy], i) => {
    const ex = x + dx, ey = top + dy, cx = x + dx * .3, cy = top + dy * .9;
    o += P(`M${x} ${top} Q${cx} ${cy} ${ex} ${ey}`, 'n');
    for (let t = .35; t < 1; t += .13) {
      const px = (1 - t) * (1 - t) * x + 2 * (1 - t) * t * cx + t * t * ex;
      const py = (1 - t) * (1 - t) * top + 2 * (1 - t) * t * cy + t * t * ey;
      const s = 26 * (1 - t * .6);
      o += L(px, py, px + (i % 2 ? s : -s) * .6, py + s * .7, 'g');
    }
  });
  return o;
}
function tree(x, ground, h = 420) {
  let o = P(`M${x - 46} ${ground - 96} H${x + 46} L${x + 38} ${ground} H${x - 38} Z`, 't');
  o += P(`M${x} ${ground - 96} C${x - 6} ${ground - h * .5} ${x + 10} ${ground - h * .7} ${x} ${ground - h * .85}`, 'n');
  const r = rng(x);
  for (let i = 0; i < 9; i++) {
    const a = r() * Math.PI * 2, d = 20 + r() * 70;
    o += E(x + Math.cos(a) * d, ground - h + Math.sin(a) * d * .7, 34 + r() * 22, 26 + r() * 16, 'c');
  }
  return o;
}

const SCENES = {
  arches() {
    let o = base('w');
    const tones = [['t', 'l', 's', 'c', 'a'], ['c', 's', 'l', 't', 'l'], ['l', 'a', 't', 'c', 's']];
    [250, 600, 950].forEach((cx, i) => {
      const r = 130, top = 210, a = cx - r, b = cx + r;
      o += P(`M${a} 760 V${top + r} A${r} ${r} 0 0 1 ${b} ${top + r} V760 Z`, 'r');
      o += P(`M${a + 16} 760 V${top + r} A${r - 16} ${r - 16} 0 0 1 ${b - 16} ${top + r} V760`, 'g');
      o += rail(a + 30, b - 30, 372, 5, 11 + i * 7, tones[i]);
      o += E(cx, 96, 66, 6, 'l');
    });
    o += P('M520 642 Q520 628 540 628 H660 Q680 628 680 642 V760 H520 Z', 't');
    o += L(520, 650, 680, 650, 'g');
    o += P('M585 628 Q570 590 592 566 Q600 556 608 566 Q630 590 615 628 Z', 's');
    return o;
  },
  curtain() {
    let o = base('w');
    o += folds(56, 330, 72, 760, 'a') + folds(870, 1144, 72, 760, 'a');
    o += L(40, 72, 1160, 72);
    o += E(600, 290, 30, 30, 'l') + P('M588 292 H612 A12 12 0 1 0 607 301', 'n');
    o += rail(360, 500, 370, 4, 5, ['l', 't', 'c', 's']) + rail(700, 840, 370, 4, 9, ['c', 's', 'l', 't']);
    o += P('M536 640 V572 Q536 532 576 532 H624 Q664 532 664 572 V640 Z', 'l');
    o += R(530, 612, 140, 148, 's');
    for (let x = 550; x < 670; x += 20) o += L(x, 612, x, 760, 'g');
    for (let y = 632; y < 760; y += 20) o += L(530, y, 670, y, 'g');
    o += E(420, 92, 40, 5, 'l') + E(780, 92, 40, 5, 'l');
    return o;
  },
  cafe() {
    let o = base('w');
    o += R(0, 430, 1200, 330, 's');
    for (let x = 100; x < 1200; x += 100) o += L(x, 430, x, 760, 'g');
    o += L(0, 444, 1200, 444, 'g');
    o += R(430, 170, 240, 190, 't') + P('M480 360 V282 A70 70 0 0 1 620 282 V360 Z', 'l');
    o += P('M96 612 V522 Q96 492 126 492 H874 Q904 492 904 522 V612 Z', 'a');
    for (let x = 136; x < 880; x += 40) o += L(x, 498, x, 608, 'g');
    o += R(86, 612, 828, 40, 'a', 6) + R(96, 652, 808, 108, 't');
    [240, 500, 760].forEach(x => {
      o += pendant(x, 300, 72);
      o += L(x, 680, x, 752) + E(x, 755, 30, 5, 's') + E(x, 674, 72, 9, 'l');
    });
    o += palm(1065, 760);
    return o;
  },
  office() {
    let o = base('w');
    o += R(70, 140, 310, 620, 'r');
    o += L(225, 140, 225, 760);
    const r = rng(42);
    [240, 340, 440, 540, 640].forEach(y => {
      o += L(70, y, 380, y);
      [[80, 215], [235, 370]].forEach(([s, e]) => {
        let x = s + r() * 20;
        while (x < e - 30) {
          if (r() < .18) { o += E(x + 16, y - 18, 14, 18, 't'); x += 40; continue; }
          const w = 9 + r() * 9, h = 52 + r() * 30;
          o += R(x, y - h, w, h, r() < .5 ? 'c' : (r() < .5 ? 't' : 'l'));
          x += w + 1;
        }
      });
    });
    o += R(985, 110, 215, 650, 'l');
    [1055, 1125].forEach(x => { o += L(x, 110, x, 760); });
    o += L(985, 220, 1200, 220) + L(1040, 470, 1040, 520);
    o += L(560, 0, 560, 246) + L(880, 0, 880, 246) + R(512, 246, 416, 10, 's', 3);
    o += R(560, 470, 108, 104, 't', 22) + R(772, 470, 108, 104, 't', 22);
    o += R(456, 558, 508, 18, 's', 2) + R(478, 576, 18, 184, 's') + R(924, 576, 18, 184, 's');
    o += P('M600 558 L612 524 H676 L684 558 Z', 'l');
    o += L(890, 558, 890, 502) + L(890, 502, 860, 476) + P('M840 488 Q846 462 870 466 Q884 470 878 492 Z', 's');
    return o;
  },
  villa() {
    let o = base('w');
    o += R(380, 120, 640, 530, 'l');
    [593, 806].forEach(x => { o += L(x, 120, x, 650); });
    o += L(380, 236, 1020, 236) + L(370, 650, 1030, 650);
    o += L(280, 96, 1120, 96);
    o += folds(296, 412, 96, 760, 'c', 18) + folds(988, 1104, 96, 760, 'c', 18);
    o += P('M280 772 H1010 L1090 870 H200 Z', 'c');
    o += P('M330 652 V604 Q330 572 362 572 H988 Q1020 572 1020 604 V652 Z', 't');
    o += R(380, 590, 110, 70, 'l', 18) + R(870, 590, 110, 70, 'l', 18);
    o += R(316, 652, 718, 54, 't', 14) + R(340, 706, 670, 12, 's');
    o += L(360, 718, 360, 742) + L(990, 718, 990, 742);
    o += R(560, 716, 230, 38, 'l', 19) + R(630, 754, 90, 10, 't');
    o += P('M1124 760 V320 Q1124 270 1064 270 Q1004 270 990 306', 'n') + E(1124, 762, 34, 5, 's');
    o += P('M960 340 Q960 306 990 306 Q1020 306 1020 340 Z', 's') + E(990, 346, 26, 4, 'l');
    o += tree(190, 760, 470);
    return o;
  }
};

const ALIGN = { center: 'xMidYMid slice', left: 'xMinYMid slice', right: 'xMaxYMid slice', top: 'xMidYMin slice' };
function drawing(scene, label, align = 'center') {
  return `<svg class="dr" viewBox="0 0 1200 900" preserveAspectRatio="${ALIGN[align]}" role="img" aria-label="${label}">${SCENES[scene]()}</svg>`;
}

/* A project image: real photo if supplied, otherwise its drawing. */
function art(p, align, n = 0) {
  const photo = n === 0 ? p.photo : (p.gallery || [])[n - 1];
  const label = `${p.name}, ${sector(p.sector).name.toLowerCase()} interior`;
  const inner = photo
    ? `<img src="${photo}" alt="${label}" loading="${n === 0 && align === 'eager' ? 'eager' : 'lazy'}" decoding="async">`
    : drawing(p.scene, `Drawing of ${label}`, align === 'eager' ? 'center' : align);
  return `<div class="art">${inner}</div>`;
}
function media(p, ratio, align = 'center', n = 0) {
  return `<div class="media ${ratio} reveal">${art(p, align, n)}<span class="curtain" aria-hidden="true"></span></div>`;
}

              <select class="input" id="f-when" name="when">${['As soon as possible', 'In 1 to 3 months', 'In 3 to 6 months', 'Just exploring for now'].map(opt).join('')}</select></div>
            <div class="field"><label for="f-msg">About the project</label>
              <textarea class="input" id="f-msg" name="message" aria-describedby="h-msg"></textarea><p class="hint" id="h-msg">Location, what the space is for, and anything you already have, such as drawings or a lease.</p></div>
            <div class="form-foot">
              <button class="btn btn-primary" type="submit">Send enquiry</button>
              <p id="form-note">Fields marked * are required. We only use your details to reply to this enquiry.</p>
            </div>
          </form>
        </div>
        <aside class="direct" aria-labelledby="direct-h">
          <h2 class="h3" id="direct-h">Or talk to us directly</h2>
          <dl>
            <div><dt>Call</dt><dd><a href="tel:${tel(CONTACT.phone)}">${CONTACT.phone}</a></dd></div>
            <div><dt>WhatsApp</dt><dd><a href="${waLink()}" target="_blank" rel="noopener">${CONTACT.whatsapp}</a></dd></div>
            <div><dt>Email</dt><dd><a href="mailto:${CONTACT.email}">${CONTACT.email}</a></dd></div>
            <div><dt>Instagram</dt><dd><a href="https://instagram.com/${CONTACT.instagram}" target="_blank" rel="noopener">@${CONTACT.instagram}</a></dd></div>
            <div><dt>Office hours</dt><dd>${CONTACT.hours}</dd></div>
            <div><dt>Office</dt><dd>${CONTACT.address}</dd></div>
          </dl>
        </aside>
      </div>`
    };
  },

  notFound() {
    return {
      title: 'Page not found | Bella Interior',
      html: `<section class="wrap page-head" style="padding-bottom:clamp(100px,12vw,180px)">
        <h1 class="display-2" tabindex="-1">This page does not exist</h1>
        <p class="lead">The link may be out of date. Go back to the home page or browse our projects.</p>
        <div class="actions" style="margin-top:32px"><a class="btn btn-primary" href="#/">Go to home page</a><a class="btn btn-quiet" href="#/projects">See projects</a></div>
      </section>`
    };
  }
};

/* =====================================================================
   ROUTER + TRANSITIONS
   ===================================================================== */
const main = document.getElementById('main');
const reduce = matchMedia('(prefers-reduced-motion: reduce)');
let navToken = 0, firstRender = true;

function parse() {
  const raw = location.hash.replace(/^#/, '') || '/';
  const [path, qs = ''] = raw.split('?');
  const q = Object.fromEntries(new URLSearchParams(qs));
  const parts = path.split('/').filter(Boolean);
  if (!parts.length) return { name: 'home', nav: 'home', q };
  if (parts[0] === 'projects' && parts[1]) return { name: 'project', nav: 'projects', q, arg: parts[1] };
  if (VIEWS[parts[0]] && parts[0] !== 'project' && parts[0] !== 'notFound') return { name: parts[0], nav: parts[0], q };
  return { name: 'notFound', nav: '', q };
}

function render() {
  let r = parse();
  if (location.hash && !location.hash.startsWith('#/')) { // in-page anchors like #main / #top
    if (!firstRender) return;
    r = { name: 'home', nav: 'home', q: {} };
  }
  const view = VIEWS[r.name](r.q, r.arg);
  const token = ++navToken;
  const swap = () => {
    if (token !== navToken) return;
    main.innerHTML = view.html;
    document.title = view.title;
    document.querySelectorAll('[data-nav]').forEach(a => a.dataset.nav === r.nav ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
    window.scrollTo(0, 0);
    if (!firstRender) main.querySelector('h1')?.focus({ preventScroll: true });
    setupView();
  };
  closeMenu(false);
  if (firstRender || reduce.matches || !document.documentElement.classList.contains('motion')) {
    swap(); firstRender = false; return;
  }
  main.classList.add('is-leaving');
  setTimeout(() => {
    if (token !== navToken) return;
    main.classList.remove('is-leaving');
    main.classList.add('is-entering');
    swap();
    requestAnimationFrame(() => requestAnimationFrame(() => { if (token === navToken) main.classList.remove('is-entering'); }));
  }, 170);
}

/* Reveals: each image's curtain draws aside once, when it scrolls into view */
let io;
function setupView() {
  const hero = main.querySelector('[data-hero]');
  if (hero) requestAnimationFrame(() => requestAnimationFrame(() => hero.classList.add('is-in')));
  io?.disconnect();
  const items = main.querySelectorAll('.reveal');
  if (!('IntersectionObserver' in window)) { items.forEach(n => n.classList.add('is-in')); return; }
  io = new IntersectionObserver(entries => entries.forEach(e => {
    if (e.isIntersecting) { e.target.classList.add('is-in'); io.unobserve(e.target); }
  }), { rootMargin: '0px 0px -12% 0px', threshold: 0.08 });
  items.forEach(n => io.observe(n));
}

/* =====================================================================
   INTERACTIONS
   ===================================================================== */
// Filters
main.addEventListener('click', e => {
  const b = e.target.closest('[data-filter]');
  if (!b) return;
  const id = b.dataset.filter;
  const target = id === 'all' ? '#/projects' : `#/projects?s=${id}`;
  if (location.hash !== target) {
    history.replaceState(null, '', target);
    const view = VIEWS.projects(parse().q);
    const y = window.scrollY;
    main.innerHTML = view.html;
    window.scrollTo(0, y);
    setupView();
    main.querySelector(`[data-filter="${id}"]`)?.focus();
  }
});

// Mobile menu
const menu = document.getElementById('menu');
const menuBtn = document.querySelector('.menu-btn');
let menuTimer;
function openMenu() {
  clearTimeout(menuTimer);
  menu.hidden = false;
  document.body.classList.add('menu-open');
  menuBtn.setAttribute('aria-expanded', 'true');
  menuBtn.textContent = 'Close';
  requestAnimationFrame(() => requestAnimationFrame(() => menu.classList.add('is-open')));
  menu.querySelector('a')?.focus({ preventScroll: true });
}
function closeMenu(returnFocus = true) {
  if (menu.hidden) return;
  menu.classList.remove('is-open');
  document.body.classList.remove('menu-open');
  menuBtn.setAttribute('aria-expanded', 'false');
  menuBtn.textContent = 'Menu';
  menuTimer = setTimeout(() => { menu.hidden = true; }, 260);
  if (returnFocus) menuBtn.focus();
}
menuBtn.addEventListener('click', () => (menu.hidden ? openMenu() : closeMenu()));
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !menu.hidden) closeMenu(); });
matchMedia('(min-width: 920px)').addEventListener?.('change', ev => { if (ev.matches) closeMenu(false); });

// Header border once scrolled
const header = document.querySelector('.site-header');
let ticking = false;
addEventListener('scroll', () => {
  if (ticking) return; ticking = true;
  requestAnimationFrame(() => { header.classList.toggle('is-scrolled', scrollY > 8); ticking = false; });
}, { passive: true });

// Contact form: validate on blur, summarise on submit
const RULES = {
  name: v => v.trim().length >= 2 || 'Enter your name so we know who to ask for.',
  phone: v => v.replace(/[^\d]/g, '').length >= 8 || 'Enter a phone number with at least 8 digits, e.g. +971 50 123 4567.',
  email: v => !v.trim() || /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.trim()) || 'Enter an email like name@company.com, or leave it empty.',
  type: v => !!v || 'Choose the type of space so we can send the right person.'
};
function check(input) {
  const rule = RULES[input.name];
  if (!rule) return true;
  const res = rule(input.value);
  const err = document.getElementById('e-' + input.name);
  if (res === true) { input.removeAttribute('aria-invalid'); err.hidden = true; err.textContent = ''; return true; }
  input.setAttribute('aria-invalid', 'true'); err.hidden = false; err.textContent = res;
  return res;
}
main.addEventListener('focusout', e => {
  const f = e.target.closest('form.form');
  if (f && e.target.name && (e.target.value || e.target.hasAttribute('aria-invalid'))) check(e.target);
});
main.addEventListener('input', e => {
  if (e.target.closest('form.form') && e.target.getAttribute('aria-invalid') === 'true') check(e.target);
});
main.addEventListener('submit', e => {
  const form = e.target.closest('form.form');
  if (!form) return;
  e.preventDefault();
  const problems = [];
  ['name', 'phone', 'email', 'type'].forEach(n => {
    const input = form.elements[n]; const res = check(input);
    if (res !== true) problems.push([input.id, res]);
  });
  const summary = form.querySelector('.error-summary');
  if (problems.length) {
    summary.querySelector('ul').innerHTML = problems.map(([id, msg]) => `<li><a class="link" href="#${id}" data-focus="${id}">${msg}</a></li>`).join('');
    summary.hidden = false; summary.focus();
    return;
  }
  summary.hidden = true;
  const btn = form.querySelector('[type=submit]');
  btn.disabled = true; btn.textContent = 'Sending…';
  // DEMO: no backend yet. Connect to email/CRM before going live.
  setTimeout(() => {
    const name = form.elements.name.value.trim().split(/\s+/)[0];
    const slot = form.parentElement;
    slot.innerHTML = `<div class="success" tabindex="-1" role="status">
      <h2>Enquiry sent</h2>
      <p>Thanks, ${esc(name)}. We will call you within one working day to talk through your project and arrange a site visit.</p>
      <div class="actions"><a class="btn btn-quiet" href="#/projects">See our projects</a></div>
    </div>`;
    slot.querySelector('.success').focus();
  }, 700);
});
main.addEventListener('click', e => {
  const a = e.target.closest('[data-focus]');
  if (!a) return;
  e.preventDefault();
  const t = document.getElementById(a.dataset.focus);
  t?.focus(); t?.scrollIntoView({ block: 'center', behavior: reduce.matches ? 'auto' : 'smooth' });
});

addEventListener('hashchange', render);
render();
