<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Lead Hunter</title>
    <link rel="stylesheet" href="../dashboard/dashboard.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="p-head">
      <img src="../icons/icon-48.png" alt="" width="24" height="24" />
      <b>Lead Hunter</b>
      <button class="btn sm" data-dash>Dashboard</button>
    </header>
    <div class="p-stats" data-stats></div>
    <div class="p-hunt" data-hunt hidden></div>
    <div class="p-row">
      <button class="btn pri" data-find>Find businesses</button>
      <button class="btn" data-leads>Leads</button>
    </div>
    <p class="hint">Businesses that just opened without a working website, or whose website is down or parked, with an email address that passed its checks.</p>
    <script src="popup.js"></script>
  </body>
</html>
