<!DOCTYPE html>
<html>
  <head>
    <base target="_blank" />
    <style>
      body { margin: 0; padding: 14px; font: 14px/1.45 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: #1f2328; }
      .stats { display: flex; gap: 8px; margin-bottom: 12px; }
      .stat { flex: 1; padding: 8px 10px; background: #f6f8fa; border-radius: 8px; }
      .stat b { display: block; font-size: 18px; }
      .stat span { font-size: 12px; color: #59636e; }
      .card { padding: 12px; border: 1px solid #d1d9e0; border-radius: 10px; }
      .name { font-size: 15px; font-weight: 600; }
      .meta { margin: 2px 0 10px; font-size: 12px; color: #59636e; }
      textarea { box-sizing: border-box; width: 100%; min-height: 160px; padding: 8px; font: inherit; border: 1px solid #d1d9e0; border-radius: 8px; resize: vertical; }
      .btn { display: block; box-sizing: border-box; width: 100%; margin-top: 8px; padding: 10px; font: inherit; font-weight: 600; text-align: center; text-decoration: none; border: 0; border-radius: 8px; cursor: pointer; }
      .primary { background: #25d366; color: #062e16; }
      .row { display: flex; gap: 8px; }
      .secondary { background: #f6f8fa; color: #1f2328; border: 1px solid #d1d9e0; }
      .btn[disabled] { opacity: 0.5; cursor: default; }
      .warn { margin-bottom: 10px; padding: 8px 10px; font-size: 13px; background: #fff8c5; border: 1px solid #d4a72c66; border-radius: 8px; }
      .empty { padding: 30px 10px; text-align: center; color: #59636e; }
      .help { margin-top: 12px; font-size: 12px; color: #59636e; }
    </style>
  </head>
  <body>
    <div class="stats">
      <div class="stat"><b id="sent">–</b><span>chats today</span></div>
      <div class="stat"><b id="queue">–</b><span>new leads waiting</span></div>
    </div>
    <div id="main"><div class="empty">Loading…</div></div>
    <p class="help">
      “Open in WhatsApp” opens the chat with your message typed in. You still press send yourself. The lead is then
      marked <i>Messaged</i> in the sheet. Edit the message above first if you want to personalise it.
    </p>

    <script>
      var skipped = [];
      var pastLimit = false;

      function $(id) { return document.getElementById(id); }

      function load() {
        google.script.run.withSuccessHandler(render).withFailureHandler(fail).outreachNext(skipped);
      }

      function mark(mobile, status) {
        google.script.run.withSuccessHandler(render).withFailureHandler(fail).outreachMark(mobile, status, skipped);
      }

      function busy() {
        var buttons = document.querySelectorAll('button');
        for (var i = 0; i < buttons.length; i++) buttons[i].disabled = true;
      }

      function fail(err) {
        $('main').innerHTML = '<div class="warn"></div><button class="btn secondary" id="retry">Try again</button>';
        document.querySelector('.warn').textContent = (err && err.message) || String(err);
        $('retry').onclick = load;
      }

      function render(d) {
        $('sent').textContent = d.limit ? d.sentToday + ' / ' + d.limit : d.sentToday;
        $('queue').textContent = d.queue;
        var main = $('main');

        if (!d.lead) {
          main.innerHTML =
            '<div class="empty">No new leads waiting.<br>Run <b>Lead Engine → Find leads now</b> to get more.</div>';
          return;
        }

        if (d.limit && d.sentToday >= d.limit && !pastLimit) {
          main.innerHTML =
            '<div class="warn">You have reached today\'s limit of ' + d.limit + ' chats. Messaging lots of new ' +
            'people from one number in a day is the fastest way to get it restricted by WhatsApp. Pick this up ' +
            'again tomorrow.</div><button class="btn secondary" id="anyway">Show the next lead anyway</button>';
          $('anyway').onclick = function () { pastLimit = true; render(d); };
          return;
        }

        var lead = d.lead;
        main.innerHTML =
          '<div class="card"><div class="name"></div><div class="meta"></div><textarea id="msg"></textarea>' +
          '<a class="btn primary" id="open">Open in WhatsApp</a>' +
          '<div class="row"><button class="btn secondary" id="skip">Skip for now</button>' +
          '<button class="btn secondary" id="dnc">Do not contact</button></div></div>';
        main.querySelector('.name').textContent = lead.name || lead.mobile;
        main.querySelector('.meta').textContent = [lead.mobile, lead.category, lead.area].filter(Boolean).join(' · ');

        var msg = $('msg');
        var open = $('open');
        msg.value = lead.message;
        function updateLink() {
          open.href = 'https://wa.me/' + lead.mobile.replace(/\D/g, '') + '?text=' + encodeURIComponent(msg.value);
        }
        msg.oninput = updateLink;
        updateLink();

        // Let the link open first, then update the sheet.
        open.onclick = function () {
          setTimeout(function () { busy(); mark(lead.mobile, 'Messaged'); }, 0);
        };
        $('skip').onclick = function () { skipped.push(lead.mobile); busy(); load(); };
        $('dnc').onclick = function () { busy(); mark(lead.mobile, 'Do not contact'); };
      }

      load();
    </script>
  </body>
</html>
